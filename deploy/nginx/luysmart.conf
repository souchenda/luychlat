# Needs, in the http context (/etc/nginx/conf.d/02-websocket-upgrade.conf):
#   map $http_upgrade $connection_upgrade { default upgrade; "" ""; }
# /etc/nginx/sites-available/luysmart  (Droplet; Docker or PM2 on 127.0.0.1:3000)
# Replace luysmart.example.com, then: sudo certbot --nginx -d luysmart.example.com
# Certbot adds the 443 server block and the HTTP -> HTTPS redirect.

upstream luysmart_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name luysmart.example.com;

    # Receipts and backups go to Supabase / the device, not through this proxy.
    client_max_body_size 10m;

    # Signed-in responses carry large Supabase auth cookies (Set-Cookie): the
    # default 4–8k header buffer turns them into "upstream sent too big header" 502s.
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Security headers (CSP, HSTS, nosniff, frame DENY, ...) come from the app
    # (next.config.ts) on every response. Repeating them here would duplicate
    # them, and locations with their own add_header would drop them anyway.
    server_tokens off;

    # Fingerprinted build assets never change: cache for a year.
    location /_next/static/ {
        proxy_pass http://luysmart_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker must always be revalidated so updates reach users.
    location = /sw.js {
        proxy_pass http://luysmart_app;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://luysmart_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade when asked for (map in /etc/nginx/conf.d/02-websocket-upgrade.conf); keep-alive otherwise.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # /api/advisor can take up to ~60 s for a live AI answer.
        proxy_read_timeout 75s;
    }
}
