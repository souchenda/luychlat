# Needs, in the http context (/etc/nginx/conf.d/02-websocket-upgrade.conf):
#   map $http_upgrade $connection_upgrade { default upgrade; "" ""; }
# /etc/nginx/sites-available/luy.yourdomain.com
#
# LuyChlat on a SHARED Droplet: a separate server block for the subdomain only;
# existing sites are not touched. Get the certificate first (see
# docs/deploy-digitalocean.md, section C), replace luy.yourdomain.com
# everywhere, and set the upstream port if you changed APP_PORT.

upstream luysmart_app {
    server 127.0.0.1:3000;   # APP_PORT from .env (container listens on 3000 inside)
    keepalive 16;
}

# HTTP -> HTTPS (keeps the ACME path so certificate renewals keep working)
server {
    listen 80;
    listen [::]:80;
    server_name luy.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Works on every Nginx in Ubuntu 20.04–24.04 (newer Nginx may print a harmless
    # deprecation notice; there you can use "listen 443 ssl;" + "http2 on;").
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name luy.yourdomain.com;

    # Issued by: sudo certbot certonly --nginx -d luy.yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/luy.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luy.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HTTPS is required by the app (PIN lock, biometrics, PWA install).
    # Security headers (CSP, HSTS, nosniff, frame DENY, ...) come from the app
    # (next.config.ts) on every response. Repeating them here would duplicate
    # them, and locations with their own add_header would drop them anyway.
    server_tokens off;

    client_max_body_size 10m;

    # Signed-in responses carry large Supabase auth cookies (Set-Cookie): the
    # default 4–8k header buffer turns them into "upstream sent too big header" 502s.
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Fingerprinted build assets never change: cache for a year.
    location /_next/static/ {
        proxy_pass http://luysmart_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker must always be revalidated so updates reach users.
    location = /sw.js {
        proxy_pass http://luysmart_app;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://luysmart_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade when asked for (map in /etc/nginx/conf.d/02-websocket-upgrade.conf); keep-alive otherwise.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # /api/advisor can take up to ~60 s for a live AI answer.
        proxy_read_timeout 75s;
    }
}
