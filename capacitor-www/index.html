<!doctype html>
<html lang="km">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>លុយឆ្លាត</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        text-align: center;
        background: #fff;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #f5f5f5; }
        p { color: #a3a3a3; }
      }
      .mark { width: 56px; height: 56px; border-radius: 16px; background: #059669; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }
      h1 { font-size: 18px; font-weight: 600; margin: 8px 0 0; }
      p { font-size: 14px; color: #737373; margin: 0; line-height: 1.6; }
      button { margin-top: 12px; height: 44px; padding: 0 24px; border: 0; border-radius: 12px; background: #059669; color: #fff; font-size: 14px; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">៛</div>
    <h1>មិនមានអ៊ីនធឺណិត</h1>
    <p>សូមភ្ជាប់អ៊ីនធឺណិត ហើយព្យាយាមម្ដងទៀត។<br />No internet connection — please try again.</p>
    <button type="button" onclick="location.href = 'https://luy.ibmserp.com/home'">ព្យាយាមម្ដងទៀត · Retry</button>
  </body>
</html>
