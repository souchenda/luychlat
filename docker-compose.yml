# LuyChlat · single-container deployment
#
#   cp .env.example .env      # set NEXT_PUBLIC_SUPABASE_URL / _ANON_KEY (optional)
#   docker compose up -d --build
#   docker compose ps         # STATUS should become "healthy"
#
# Compose reads variables from .env in this folder (not .env.local):
#   APP_BIND   host interface (default 127.0.0.1: only Nginx on this server can
#              reach the app; Docker-published ports would bypass UFW). Set
#              0.0.0.0 only for a quick test without Nginx.
#   APP_PORT   host port (default 3000). Change it if 3000 is already used on a
#              shared server; the container always listens on 3000 inside.
#   APP_MEMORY memory cap (default 512m) so the app can't starve other services.
#
# Zero-downtime deploys (deploy/update.sh) run this file as two "slots":
#   blue   project luysmart, container luysmart, port 3000
#   green  project luysmart-green, container luysmart-green, port 3001
# The new slot starts next to the old one; Nginx switches once it is healthy.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_AUTH_METHODS: ${NEXT_PUBLIC_AUTH_METHODS:-email}
        NEXT_PUBLIC_BIOMETRIC_MOCK: "false"
    image: luysmart:latest
    container_name: ${CONTAINER_NAME:-luysmart}
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Server-only (never NEXT_PUBLIC_): LuyChlat AI for PRO users. Read at runtime,
      # not baked into the image. Leave empty to turn LuyChlat AI off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Server-only: the official @LuyChlat_bot (reminders, account linking). Never NEXT_PUBLIC_.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Server-only, optional: Whisper speech-to-text for the bot's voice notes (Groq first, else OpenAI).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Server-only, optional: Gemini transcribes Khmer voice notes (much better at Khmer than Whisper).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Optional: phone push notifications (07:00 morning message). The private key is server-only.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Optional: daily market posts to the community channel / group (bot must be its admin).
      TELEGRAM_COMMUNITY_CHAT_ID: ${TELEGRAM_COMMUNITY_CHAT_ID:-}
      TELEGRAM_COMMUNITY_CHANNEL_ID: ${TELEGRAM_COMMUNITY_CHANNEL_ID:-}
      # This server sends the bot's reminders — only from the active slot (deploy/run/active-slot).
      BOT_DISPATCHER: "on"
      APP_SLOT: ${APP_SLOT:-blue}
    volumes:
      - ./deploy/run:/run/luysmart:ro
    # Lets requests in flight finish when the old slot is stopped.
    stop_grace_period: 30s
    mem_limit: ${APP_MEMORY:-512m}
    pids_limit: 256
    # The Node server needs no Linux capabilities and never escalates privileges.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
