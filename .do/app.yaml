# DigitalOcean App Platform spec (Apps → Create → "Import from App Spec",
# or: doctl apps create --spec .do/app.yaml). Replace the github.repo value.
name: luysmart
region: sgp # Singapore: closest App Platform region to Cambodia

services:
  - name: web
    github:
      repo: <github-user>/luysmart
      branch: master
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
    routes:
      - path: /
    envs:
      # NEXT_PUBLIC_* are inlined at build time: App Platform passes them to the
      # Dockerfile as build args. Leave empty for Guest Mode only.
      - key: NEXT_PUBLIC_SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: NEXT_PUBLIC_BIOMETRIC_MOCK
        scope: RUN_AND_BUILD_TIME
        value: "false"
